name: Agente de Vagas

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      motivo:
        description: "Motivo da execução manual"
        required: false
        default: "Teste manual"

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # ──' CORREÇÃO DO BUG DE PERSISTÊNCIA ──────────────────────────────
      # Baixa o banco de dados da execução anterior (se existir)
      # sem isso, vaga_existe() nunca encontra nada entre execuções
      # e a deduplicação não funciona
      - name: Restaurar banco de dados
        uses: actions/cache@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_number }}
          restore-keys: |
            jobs-db-
      # ─────────────────────────────────────────────────────────────────

      - name: Criar pasta data se não existir
        run: mkdir -p data

      - name: Executar o agente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install google-genai requests python-dotenv
          mkdir -p data
          python main.py

      # Salva o banco atualizado para a próxima execução
      - name: Salvar banco de dados como artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobs-database-${{ github.run_number }}
          path: data/jobs.db
          retention-days: 30
